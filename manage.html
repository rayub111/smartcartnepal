<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SmartCart Nepal — Manage products</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
<link rel="stylesheet" href="admin.css?v=3">
</head>
<body>
<section id="adminPanel" class="admin-panel">
  <div class="wrap admin-wrap">
    <div class="admin-header">
      <h1 class="admin-title">SmartCart<span class="logo-accent">Nepal</span> <span class="mono admin-title-tag">/manage</span></h1>
      <a href="index.html" target="_blank" class="admin-link mono">View live site ↗</a>
    </div>
    <div class="admin-grid">
      <form id="productForm" class="admin-card">
        <h2 id="formTitle">Add a product</h2>
        <label>Name <input type="text" id="f_name" required placeholder="e.g. Anker Soundcore Life Q30"></label>
        <label>Category <select id="f_category"></select></label>
        <div id="newCategoryRow" class="admin-inline" hidden>
          <input type="text" id="f_newCategoryLabel" placeholder="New category name, e.g. Cameras">
          <button type="button" id="addCategoryConfirm" class="admin-btn-small">Add</button>
        </div>
        <button type="button" id="showNewCategory" class="admin-textlink mono">+ Add a new category</button>
        <label>Price <input type="text" id="f_price" required placeholder="e.g. Rs 8,500"></label>
        <label>Short description <textarea id="f_blurb" rows="2" required placeholder="1-2 sentences on what it is"></textarea></label>
        <label>Why you picked it <textarea id="f_why" rows="2" required placeholder="Your honest editorial note"></textarea></label>
        <label>Affiliate link <input type="url" id="f_link" required placeholder="https://..."></label>
        <label>Product photo <input type="file" id="f_imageFile" accept="image/*"></label>
        <p class="admin-or mono">— or —</p>
        <label>Image URL <input type="text" id="f_imageUrl" placeholder="https://... (optional if uploading a file)"></label>
        <img id="imagePreview" class="admin-preview-img" hidden>
        <label class="admin-checkbox"><input type="checkbox" id="f_pick"> Mark as Curator's Pick</label>
        <div class="admin-form-actions">
          <button type="submit" class="admin-btn">Save product</button>
          <button type="button" id="cancelEdit" class="admin-btn-secondary" hidden>Cancel edit</button>
        </div>
        <p id="formStatus" class="admin-status"></p>
      </form>
      <div class="admin-card">
        <h2>Your added products <span id="countTag" class="mono"></span></h2>
        <p class="admin-hint">You can remove any product here. Changes apply in this browser; export them to publish for everyone.</p>
        <div id="adminList" class="admin-list"></div>
        <button id="exportBtn" class="admin-btn admin-export">Export updated products.js</button>
      </div>
    </div>
  </div>
</section>
<script src="shared.js?v=3"></script>
<script src="products.js?v=3"></script>
<script src="admin.js?v=3"></script>
</body>
</html>
